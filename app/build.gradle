plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lucas.pantallaremota'
    compileSdk 34

    defaultConfig {
        applicationId "com.lucas.pantallaremota"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
}
